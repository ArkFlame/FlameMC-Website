name: Build and deploy FlameMC website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source
        run: npm run check:static

      - name: Build static Astro site
        run: npm run build

      - name: Preserve static GitHub Pages assets
        run: touch dist/.nojekyll

      - name: Verify Pages artifact contains the website (not README)
        run: npm run check:deploy

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built dist directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
